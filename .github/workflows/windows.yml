name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Hash release files
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          Get-ChildItem -File $release | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring((Resolve-Path $release).Path.Length + 1))" } |
            Set-Content "$release/SHA256SUMS.txt" -Encoding utf8
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/simorgh-windows-portable.zip" -Force
      - name: Upload portable release
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-windows-portable
          path: build/windows/x64/runner/Release/
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-windows-release
          path: build/simorgh-windows-portable.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simorgh-windows-release
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/simorgh-windows-portable.zip
