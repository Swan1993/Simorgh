name: simorgh
description: Simorgh privacy-first Cloudflare tunnel desktop client UI.
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  tray_manager: ^0.8.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

assets:
  - assets/logo/logo.png
  - assets/logo/logo-icon.ico
  - assets/core/windows-amd64/
